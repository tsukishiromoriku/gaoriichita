<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview: Mountain Glassmorphism Profile (Cat & Discord)</title>
  <style>
    body {
      background-color: #04060a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 860px;
      width: 100%;
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }
    .badge {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1a2234;
      font-size: 13px;
      color: #94a3b8;
    }
    .badge span {
      color: #5865F2;
      font-weight: 600;
    }
    .svg-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .svg-wrap img {
      width: 100%;
      height: auto;
      border-radius: 36px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">
      <div>🏔️ <strong>Mountain Glassmorphism Mode</strong> &mdash; <span>Gaori Ichita Profile</span></div>
      <div>🐱 Cat Thumbs-Up &bull; 💬 Discord Only</div>
    </div>
    <div class="svg-wrap">
      <img src="github-profile.svg" alt="Mountain Glassmorphism GitHub Profile" />
    </div>
  </div>
</body>
</html>
