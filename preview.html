<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Profile README Preview</title>
  <style>
    body {
      background-color: #050507;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 860px;
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .header-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #21262d;
      color: #8b949e;
      font-size: 14px;
    }
    .header-badge strong {
      color: #58a6ff;
    }
    .svg-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .svg-wrapper img {
      max-width: 100%;
      height: auto;
      border-radius: 36px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-badge">
      <span>🐱 <strong>README.md</strong> &mdash; GitHub Profile Preview</span>
    </div>
    <div class="svg-wrapper">
      <img src="github-profile.svg" alt="GitHub Profile Portfolio" />
    </div>
  </div>
</body>
</html>
