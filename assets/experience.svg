<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="840" height="500" fill="none">
  <defs>
    <style>
  @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&amp;family=Space+Mono:ital,wght@0,400;0,700;1,400&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap');

  * { box-sizing: border-box; }

  .font-title {
    font-family: 'Space Mono', 'Courier Prime', 'Courier New', monospace;
    font-weight: 700;
  }
  .font-mono {
    font-family: 'Space Mono', 'Courier Prime', 'Courier New', monospace;
  }
  .font-sans {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  .nav-item {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    fill: #858590;
    transition: fill 0.2s ease;
  }
  .nav-item:hover { fill: #ffffff; cursor: pointer; }

  .btn-hover {
    cursor: pointer;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .btn-hover:hover {
    opacity: 0.92;
    transform: translateY(-1px);
  }

  .social-pill {
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .social-pill:hover rect {
    fill: #22222b;
    stroke: #454555;
  }

  .work-row:hover rect.row-bg {
    fill: #191921;
  }
</style>
  </defs>
  <rect width="840" height="500" fill="#09090b" />

  <g transform="translate(60, 30)">
    <text x="720" y="40" class="font-title" text-anchor="end" font-size="52" fill="#ffffff">Work</text>

    <g id="work-table" transform="translate(0, 75)">
      <line x1="0" y1="0" x2="720" y2="0" stroke="#22222a" stroke-width="1" />

      
          <g class="work-row" transform="translate(0, 0)">
            <rect class="row-bg" x="0" y="0" width="720" height="60" fill="transparent" />
            <text x="10" y="28" class="font-sans" font-size="12" font-weight="500" fill="#ffffff">2022 -</text>
            <text x="10" y="45" class="font-sans" font-size="9.5" fill="#666672">1 year 5 months</text>
            <text x="180" y="35" class="font-sans" font-size="13" font-weight="700" fill="#ffffff">ITHUB</text>
            <text x="420" y="35" class="font-sans" font-size="12" fill="#888894">
              Frontend developer <tspan fill="#444450">|</tspan> <tspan fill="#b0b0b8">React & Vue</tspan>
            </text>
            <line x1="0" y1="60" x2="720" y2="60" stroke="#22222a" stroke-width="1" />
          </g>

          <g transform="translate(0, 60)">
            <rect x="0" y="0" width="720" height="58" fill="#ffffff" rx="2" />
            <text x="12" y="27" class="font-sans" font-size="12" font-weight="700" fill="#0f0f12">2021 - 2022</text>
            <text x="12" y="44" class="font-sans" font-size="9.5" font-weight="500" fill="#555560">8 months</text>
            <text x="180" y="35" class="font-sans" font-size="13" font-weight="700" fill="#0f0f12">VK Development Lab</text>
            <text x="420" y="35" class="font-sans" font-size="12" font-weight="500" fill="#0f0f12">
              Frontend developer <tspan fill="#888890">|</tspan> <tspan font-weight="600">React</tspan>
            </text>
            <g transform="translate(380, 24)">
              <path d="M0 0 L4 12 L7 8 L12 8 Z" fill="#0f0f12" />
            </g>
            <line x1="0" y1="58" x2="720" y2="58" stroke="#ffffff" stroke-width="1" />
          </g>

          <g class="work-row" transform="translate(0, 120)">
            <rect class="row-bg" x="0" y="0" width="720" height="60" fill="transparent" />
            <text x="10" y="28" class="font-sans" font-size="12" font-weight="500" fill="#ffffff">2020 - 2021</text>
            <text x="10" y="45" class="font-sans" font-size="9.5" fill="#666672">9 months</text>
            <text x="180" y="35" class="font-sans" font-size="13" font-weight="700" fill="#ffffff">SN Inc.</text>
            <text x="420" y="35" class="font-sans" font-size="12" fill="#888894">
              Fullstack developer <tspan fill="#444450">|</tspan> <tspan fill="#b0b0b8">JavaScript & Python</tspan>
            </text>
            <line x1="0" y1="60" x2="720" y2="60" stroke="#22222a" stroke-width="1" />
          </g>

          <g class="work-row" transform="translate(0, 180)">
            <rect class="row-bg" x="0" y="0" width="720" height="60" fill="transparent" />
            <text x="10" y="28" class="font-sans" font-size="12" font-weight="500" fill="#ffffff">2018 - 2020</text>
            <text x="10" y="45" class="font-sans" font-size="9.5" fill="#666672">1 year 11 months</text>
            <text x="180" y="35" class="font-sans" font-size="13" font-weight="700" fill="#ffffff">Business Up</text>
            <text x="420" y="35" class="font-sans" font-size="12" fill="#888894">
              Fullstack developer <tspan fill="#444450">|</tspan> <tspan fill="#b0b0b8">JavaScript & Python</tspan>
            </text>
            <line x1="0" y1="60" x2="720" y2="60" stroke="#22222a" stroke-width="1" />
          </g>
    </g>

    <g transform="translate(720, 360)">
      <text x="0" y="0" class="font-sans" font-size="11" fill="#777784" text-anchor="end">Work experience</text>
      <text x="0" y="20" class="font-sans" font-size="13" font-weight="600" font-style="italic" fill="#ffffff" text-anchor="end">4 years 9 months</text>
    </g>
  </g>
</svg>